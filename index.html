/* =================================================================
   [업그레이드] KS 15A S.O.티 (Single Mesh Version)
   - 구조: Group 제거 -> '가로 몸통(Run)'을 Main Mesh로 승격
   - 스냅: 단일 메쉬 구조 덕분에 감도 최상
   - 치수: isFitting: true 설정으로 전체 박스 치수 표시
   ================================================================= */
window.spawnProceduralSOTee15A = function() {
  saveState(); 

  const MM_PER_UNIT = 100;

  // 1. 규격 설정 (KS 15A 표준)
  const FACE_POS_MM = 27; 
  const FACE_POS = FACE_POS_MM / MM_PER_UNIT; 

  const bodyDiaMm = 27;    
  const bandDiaMm = 31;    
  const bandHeightMm = 8;  
  const chamferMm = 1;   
  
  const rBody = (bodyDiaMm / 2) / MM_PER_UNIT;
  const rBand = (bandDiaMm / 2) / MM_PER_UNIT;
  const hBand = bandHeightMm / MM_PER_UNIT;
  const hChamfer = chamferMm / MM_PER_UNIT;

  // 재질
  const mat = new THREE.MeshStandardMaterial({
    color: 0x444444, 
    roughness: 0.9,
    metalness: 0.0,
    flatShading: false
  });

  // --- 2. 본체(Main Mesh) 생성: 가로 몸통 (Run) ---
  const bandOffset = FACE_POS - (hBand / 2);
  const runLen = (bandOffset * 2) - 0.02; 
  
  // 가로 몸통 (Cylinder)
  const runGeo = new THREE.CylinderGeometry(rBody, rBody, runLen, 32);
  const mainMesh = new THREE.Mesh(runGeo, mat);

  // 본체를 바닥에 눕힘 (Z축 -90도 회전 -> Local Y가 World X가 됨)
  mainMesh.rotation.z = -Math.PI / 2;


  // --- 3. 자식 부품 붙이기 ---
  
  // (1) 세로 몸통 (Branch) -> World Z (뒤쪽)
  const branchLen = bandOffset - 0.01;
  const branchMesh = new THREE.Mesh(new THREE.CylinderGeometry(rBody, rBody, branchLen, 32), mat);
  
  // 부모가 Z로 누웠으므로, 부모의 Local Z축 = World Z축
  branchMesh.rotation.x = Math.PI / 2; // Cylinder Y -> Local Z
  branchMesh.position.z = branchLen / 2; // 뒤로 뻗음
  mainMesh.add(branchMesh);

  // (2) 수직 몸통 (Side Outlet) -> World Y (위쪽)
  const sideLen = bandOffset - 0.01;
  const sideMesh = new THREE.Mesh(new THREE.CylinderGeometry(rBody, rBody, sideLen, 32), mat);
  
  // 부모의 Local X축 = World Y축 (위쪽)
  sideMesh.rotation.z = -Math.PI / 2; // Cylinder Y -> Local X
  sideMesh.position.x = sideLen / 2; // 위로 뻗음
  mainMesh.add(sideMesh);


  // (3) 띠(Band) 생성 함수
  function createSolidBand() {
    const pts = [];
    pts.push(new THREE.Vector2(0, -hBand/2));             
    pts.push(new THREE.Vector2(rBody, -hBand/2));         
    pts.push(new THREE.Vector2(rBand, -hBand/2 + hChamfer)); 
    pts.push(new THREE.Vector2(rBand, hBand/2 - hChamfer));  
    pts.push(new THREE.Vector2(rBody, hBand/2));          
    pts.push(new THREE.Vector2(0, hBand/2));              

    const geo = new THREE.LatheGeometry(pts, 32); 
    geo.computeVertexNormals();
    return new THREE.Mesh(geo, mat);
  }

  // (4) 띠 배치 (부모 로컬 좌표계 기준)
  
  // 1. Right Band (World X+) -> Parent Local Y+
  const bandRight = createSolidBand();
  bandRight.position.set(0, bandOffset, 0); 
  mainMesh.add(bandRight);

  // 2. Left Band (World X-) -> Parent Local Y-
  const bandLeft = createSolidBand();
  bandLeft.position.set(0, -bandOffset, 0);
  mainMesh.add(bandLeft);

  // 3. Back Band (World Z+) -> Parent Local Z+ (정티의 꼬리)
  const bandBack = createSolidBand();
  bandBack.rotation.x = Math.PI / 2; 
  bandBack.position.set(0, 0, bandOffset);
  mainMesh.add(bandBack);

  // 4. Top Band (World Y+) -> Parent Local X+ (Side Outlet)
  const bandTop = createSolidBand();
  bandTop.rotation.z = -Math.PI / 2;
  bandTop.position.set(bandOffset, 0, 0); // 주의: 부모 X축 방향임
  mainMesh.add(bandTop);


  // --- 4. 속성 설정 ---
  mainMesh.userData = {
      isFitting: true,    // 부속 모드 (박스 치수)
      isPipe: false,      // 파이프 아님
      kind: "tee",        // 기본은 티 성질
      subKind: "s_o",     // S.O. 구분
      stlName: "SOTee15A_SingleMesh",

      // 스냅 포인트 (부모 로컬 좌표계 기준)
      // 부모 Y=길이(좌우), 부모 Z=깊이(전후), 부모 X=높이(상하)
      snapPoints: [
        { pos: [0, FACE_POS, 0], normal: [0, 1, 0] },   // Right (World X+)
        { pos: [0, -FACE_POS, 0], normal: [0, -1, 0] }, // Left (World X-)
        { pos: [0, 0, FACE_POS], normal: [0, 0, 1] },   // Back (World Z+)
        { pos: [FACE_POS, 0, 0], normal: [1, 0, 0] }    // Top (World Y+)
      ],
      
      threadCenters: {
        port1: [0, FACE_POS, 0],
        port2: [0, -FACE_POS, 0],
        port3: [0, 0, FACE_POS],
        port4: [FACE_POS, 0, 0]
      }
  };

  // 자식들도 본체 데이터 공유
  mainMesh.children.forEach(child => {
      child.userData = Object.assign({}, mainMesh.userData);
  });

  // --- 5. 배치 ---
  placeAtCenterAndGround(mainMesh);
  scene.add(mainMesh);
  draggable.push(mainMesh);

  clearAllSelection();
  selectedSet.add(mainMesh);
  markSelected(mainMesh);
  selectedMesh = mainMesh;

  if (typeof updatePortVisuals === "function") updatePortVisuals(mainMesh);
  updateRotationGizmo();
};

  const hChamfer = CHAMFER_MM / MM_PER_UNIT;
  
  const totalLen = facePos * 2; // 기존 십자용 길이

  const zGeo = new THREE.CylinderGeometry(rBody, rBody, singleLen, 32);

  const crossMeshZ = new THREE.Mesh(zGeo, mat);

  // --- 3. 밴드 생성 함수 (LatheGeometry) ---
  function createChamferedBand() {
    const pts = [];
    pts.push(new THREE.Vector2(0, -hBand/2)); 
    pts.push(new THREE.Vector2(rBand - hChamfer, -hBand/2)); 
    pts.push(new THREE.Vector2(rBand, -hBand/2 + hChamfer));

    geo.computeVertexNormals();
    return new THREE.Mesh(geo, mat);

  const offset = facePos - (hBand / 2);

  // 밴드 배치 (상, 하, 좌, 우 + 앞)
  const positions = [
    { pos: [0, offset, 0], rot: [0, 0, 0] },          // Top
    { pos: [0, -offset, 0], rot: [0, 0, 0] },         // Bottom
    { pos: [offset, 0, 0], rot: [0, 0, -Math.PI/2] }, // Right
    { pos: [-offset, 0, 0], rot: [0, 0, Math.PI/2] },  // Left
    { pos: [0, 0, offset], rot: [Math.PI/2, 0, 0] }   // Front (Z+)
  ];

  positions.forEach(p => {
    const band = createChamferedBand();
    band.position.set(...p.pos);
    band.rotation.set(...p.rot);
    mainMesh.add(band);
  });

  // --- 4. 속성 및 스냅 포인트 설정 ---
  mainMesh.name = "5WayTee15A";
  mainMesh.userData = {
      isFitting: true,
      kind: "5way_tee", 
      subKind: "15a",
      stlName: "5WayTee15A_Chamfer",

      snapPoints: [
        { pos: [0, facePos, 0], normal: [0, 1, 0] },    // 위
        { pos: [0, -facePos, 0], normal: [0, -1, 0] },  // 아래
        { pos: [facePos, 0, 0], normal: [1, 0, 0] },    // 오른쪽
        { pos: [-facePos, 0, 0], normal: [-1, 0, 0] },  // 왼쪽
        { pos: [0, 0, facePos], normal: [0, 0, 1] }     // 앞 (Z+)
      ],
      
      threadCenters: {
        port1: [0, facePos, 0],
        port2: [0, -facePos, 0],
        port3: [facePos, 0, 0],
        port4: [-facePos, 0, 0],
        port5: [0, 0, facePos]
      }
  };

  mainMesh.children.forEach(child => {
      child.userData = Object.assign({}, mainMesh.userData);
  });

  // --- 5. 배치 ---
  placeAtCenterAndGround(mainMesh);
  scene.add(mainMesh);
  draggable.push(mainMesh);

  clearAllSelection();
  selectedSet.add(mainMesh);
  markSelected(mainMesh);
  selectedMesh = mainMesh;

};

/* =================================================================
   [업그레이드] KS 15A S.O.엘보 (Single Mesh Version)
   - 구조: Group 제거 -> '뒤쪽 몸통(Y-Body)'을 Main Mesh로 승격
   - 배치: 기본적으로 바닥에 놓여 Right(X+), Back(Z+), Top(Y+)을 바라봄
   - 효과: 스냅 감도 최상 + 전체 크기(Box) 치수 표시
   ================================================================= */
window.spawnProceduralSOElbow15A = function() {
  saveState(); 

  const MM_PER_UNIT = 100;

  // 1. 규격 설정 (KS 15A S.O.Elbow)
  const FACE_POS_MM = 27; // 중심~끝단 거리
  const FACE_POS = FACE_POS_MM / MM_PER_UNIT; 

  const bodyDiaMm = 27;    
  const bandDiaMm = 31;    
  const bandHeightMm = 8;  
  const chamferMm = 1;   
  
  const rBody = (bodyDiaMm / 2) / MM_PER_UNIT;
  const rBand = (bandDiaMm / 2) / MM_PER_UNIT;
  const hBand = bandHeightMm / MM_PER_UNIT;
  const hChamfer = chamferMm / MM_PER_UNIT;

  // 재질 (부드러운 곡면)
  const mat = new THREE.MeshStandardMaterial({
    color: 0x444444, 
    roughness: 0.9,
    metalness: 0.0,
    flatShading: false 
  });

  // --- 2. 본체(Main Mesh) 생성: 뒤쪽 몸통 (Back) ---
  // 중심에서 시작해 Y축으로 뻗는 원통
  const bandOffset = FACE_POS - (hBand / 2);
  const armLen = bandOffset; 
  
  // Y축 방향 원통 (기본)
  const yGeo = new THREE.CylinderGeometry(rBody, rBody, armLen, 32);
  // 원점을 (0,0,0)에 두고 Y+ 방향으로 뻗게 이동
  yGeo.translate(0, armLen / 2, 0);
  
  const mainMesh = new THREE.Mesh(yGeo, mat);

  // [회전] 본체를 X축으로 -90도 회전
  // 결과: 본체(Y축) -> World Z축(Back)이 됨
  // 본체의 Local X -> World X
  // 본체의 Local Z -> World Y (Up)
  mainMesh.rotation.x = -Math.PI / 2;


  // --- 3. 자식 부품 붙이기 ---
  
  // (1) 오른쪽 몸통 (Right Arm) -> World X
  // 본체의 Local X축과 일치하므로 Z축으로 -90도 회전시켜 눕힘
  const xArm = new THREE.Mesh(yGeo.clone(), mat); // yGeo 재사용 (이미 translate됨)
  xArm.rotation.z = -Math.PI / 2; // Y -> X
  mainMesh.add(xArm);

  // (2) 위쪽 몸통 (Top Arm) -> World Y
  // 본체의 Local Z축과 일치하므로 X축으로 90도 회전
  const zArm = new THREE.Mesh(yGeo.clone(), mat);
  zArm.rotation.x = Math.PI / 2; // Y -> Z
  mainMesh.add(zArm);

  // (3) 중심부 구체 (Center Sphere)
  const centerGeo = new THREE.SphereGeometry(rBody, 32, 32);
  const centerMesh = new THREE.Mesh(centerGeo, mat);
  mainMesh.add(centerMesh);


  // (4) 띠(Band) 생성 함수
  function createSolidBand() {
    const pts = [];
    pts.push(new THREE.Vector2(0, -hBand/2));             
    pts.push(new THREE.Vector2(rBody, -hBand/2));         
    pts.push(new THREE.Vector2(rBand, -hBand/2 + hChamfer)); 
    pts.push(new THREE.Vector2(rBand, hBand/2 - hChamfer));  
    pts.push(new THREE.Vector2(rBody, hBand/2));          
    pts.push(new THREE.Vector2(0, hBand/2));              

    const geo = new THREE.LatheGeometry(pts, 32); 
    geo.computeVertexNormals();
    return new THREE.Mesh(geo, mat);
  }

  // (5) 띠 배치 (본체 로컬 좌표계 기준)
  
  // 1. Back Band (World Z+) -> Parent Local Y+
  const bandBack = createSolidBand();
  bandBack.position.set(0, bandOffset, 0); 
  mainMesh.add(bandBack);

  // 2. Right Band (World X+) -> Parent Local X+
  const bandRight = createSolidBand();
  bandRight.rotation.z = -Math.PI / 2; 
  bandRight.position.set(bandOffset, 0, 0);

  // 3. Top Band (World Y+) -> Parent Local Z+

/* =================================================================
   [최종 완성] KS 15A 플랜지 (Chamfered Version)
   - 치수: 사용자 제공 최종값 (OD 77, Thk 7.9, Hub 35/7, PCD 60)
   - 업그레이드: 원판 및 허브에 모따기(1mm) 적용
   - 구조: LatheGeometry 사용 (회전체)
   ================================================================= */
window.spawnProceduralFlange15A = function() {
  saveState(); 

  const MM_PER_UNIT = 100;

  // 1. 규격 설정
  const FLANGE_OD_MM = 77;      
  const FLANGE_THK_MM = 7.9;    
  const HUB_OD_MM = 35;         
  const HUB_LEN_MM = 7;         
  const BOLT_BCD_MM = 60;    
  const HOLE_DIA_MM = 5;
  const CHAMFER_MM = 1; // [추가] 모따기 1mm
  
  // 단위 변환
  const rFlange = (FLANGE_OD_MM / 2) / MM_PER_UNIT;
  const hDisk = FLANGE_THK_MM / MM_PER_UNIT;
  const rHub = (HUB_OD_MM / 2) / MM_PER_UNIT;
  const hHub = HUB_LEN_MM / MM_PER_UNIT;
  const rBolt = (BOLT_BCD_MM / 2) / MM_PER_UNIT;
  const rHole = (HOLE_DIA_MM / 2) / MM_PER_UNIT;
  const hChamfer = CHAMFER_MM / MM_PER_UNIT;

  const mat = new THREE.MeshStandardMaterial({
    color: 0x444444, 
    roughness: 0.9, 
    metalness: 0.0, 
    flatShading: false,
    side: THREE.DoubleSide
  });
  
  const matBolt = new THREE.MeshStandardMaterial({
    color: 0x222222, 
    roughness: 1.0 
  });

  // --- 2. 본체(Main Mesh): 원판(Disk) - 모따기 적용 ---
  // LatheGeometry를 사용하여 윗면 모서리를 깎음
  function createChamferedDisk() {
    const pts = [];
    // 반시계 방향 단면 (중심 -> 오른쪽 -> 위 -> 중심)
    // 1. 바닥 중심
    pts.push(new THREE.Vector2(0, -hDisk/2));
    // 2. 바닥 오른쪽 끝
    pts.push(new THREE.Vector2(rFlange, -hDisk/2));
    // 3. 위쪽 오른쪽 끝 (모따기 시작점)
    pts.push(new THREE.Vector2(rFlange, hDisk/2 - hChamfer));
    // 4. 위쪽 안쪽 (모따기 끝점)
    pts.push(new THREE.Vector2(rFlange - hChamfer, hDisk/2));
    // 5. 위쪽 중심
    pts.push(new THREE.Vector2(0, hDisk/2));

    const geo = new THREE.LatheGeometry(pts, 64); // 원판은 둥글게(64)
    geo.computeVertexNormals();
    return new THREE.Mesh(geo, mat);
  }

  const mainMesh = createChamferedDisk();


  // --- 3. 자식 부품 붙이기 ---

  // (1) 허브 (Hub) - 모따기 적용
  function createChamferedHub() {
    const pts = [];
    // 허브도 윗면 모서리를 깎음
    pts.push(new THREE.Vector2(0, -hHub/2));
    pts.push(new THREE.Vector2(rHub, -hHub/2));
    pts.push(new THREE.Vector2(rHub, hHub/2 - hChamfer));
    pts.push(new THREE.Vector2(rHub - hChamfer, hHub/2));
    pts.push(new THREE.Vector2(0, hHub/2));

    const geo = new THREE.LatheGeometry(pts, 32);
    geo.computeVertexNormals();
    return new THREE.Mesh(geo, mat);
  }

  const hubMesh = createChamferedHub();
  // 위치: 원판 위쪽(Y+)으로 이동
  hubMesh.position.set(0, (hDisk/2 + hHub/2), 0);
  mainMesh.add(hubMesh);


  // (2) 볼트 구멍 (4개) - Cylinder 유지
  const boltGeo = new THREE.CylinderGeometry(rHole, rHole, hDisk + 0.002, 16);

  for(let i=0; i<4; i++) {
      const angle = (Math.PI / 2) * i;
      const bx = Math.cos(angle) * rBolt;
      const bz = Math.sin(angle) * rBolt;
      
      const bolt = new THREE.Mesh(boltGeo, matBolt);
      bolt.position.set(bx, 0, bz); 
      mainMesh.add(bolt);
  }

  // --- 4. 속성 설정 ---
  mainMesh.userData = {
      isFitting: true,    
      isPipe: false,      
      kind: "flange",     
      subKind: "15a",     
      stlName: "Flange15A_Chamfer",

      snapPoints: [
        { 
            // 바닥 (Y-)
            pos: [0, -hDisk/2, 0], 
            normal: [0, -1, 0] 
        },
        { 
            // 위 (허브 끝, Y+)
            pos: [0, (hDisk/2 + hHub), 0], 
            normal: [0, 1, 0] 
        }
      ],
      
      threadCenters: {
        port1: [0, -hDisk/2, 0],
        port2: [0, (hDisk/2 + hHub), 0]
      }
  };

  mainMesh.children.forEach(child => {
      child.userData = Object.assign({}, mainMesh.userData);
  });

  // --- 5. 배치 ---
  placeAtCenterAndGround(mainMesh);
  scene.add(mainMesh);
  draggable.push(mainMesh);

  clearAllSelection();
  selectedSet.add(mainMesh);
  markSelected(mainMesh);
  selectedMesh = mainMesh;

  if (typeof updatePortVisuals === "function") updatePortVisuals(mainMesh);
  updateRotationGizmo();
};

   - 모서리 깎임(Chamfer) 적용
   - 방식: LatheGeometry(8분할) 사용

window.spawnProceduralUnion15A = function() {

  const TOTAL_LEN_MM = 44; 
  const HEX_CENTER_LEN_MM = 16; 
  const HEX_CENTER_W_MM = 44;   
  const HEX_END_W_MM = 30;      
  const CHAMFER_MM = 1; // [추가] 모따기 1mm

  const totalLen = TOTAL_LEN_MM / MM_PER_UNIT;
  const hCenter = HEX_CENTER_LEN_MM / MM_PER_UNIT;
  const rCenter = (HEX_CENTER_W_MM / 2) / MM_PER_UNIT;
  const rEnd = (HEX_END_W_MM / 2) / MM_PER_UNIT;
  const hChamfer = CHAMFER_MM / MM_PER_UNIT;
  
  const hEnd = (totalLen - hCenter) / 2;
  const halfLen = totalLen / 2;

  const matHex = new THREE.MeshStandardMaterial({
    color: 0x444444, 
    roughness: 0.9, 
    metalness: 0.0, 
    flatShading: true, // 각진 느낌
    side: THREE.DoubleSide
  });

  // --- 다각형 생성 함수 (Lathe 사용) ---
  function createChamferedPoly(radius, height, segments) {
    const pts = [];
    // 단면 그리기 (아래 -> 위)
    pts.push(new THREE.Vector2(0, -height/2));
    pts.push(new THREE.Vector2(radius - hChamfer, -height/2)); // 바닥 모따기 시작
    pts.push(new THREE.Vector2(radius, -height/2 + hChamfer)); // 바닥 모따기 끝
    pts.push(new THREE.Vector2(radius, height/2 - hChamfer));  // 위 모따기 시작
    pts.push(new THREE.Vector2(radius - hChamfer, height/2));  // 위 모따기 끝
    pts.push(new THREE.Vector2(0, height/2));

    const geo = new THREE.LatheGeometry(pts, segments);
    geo.computeVertexNormals();
    return new THREE.Mesh(geo, matHex);
  }

  // --- 2. 본체 (가운데 큰 8각) ---
  const mainMesh = createChamferedPoly(rCenter, hCenter, 8); // 8각

  mainMesh.rotation.y = Math.PI / 8;

  // --- 3. 자식 (양쪽 작은 8각) ---
  const offset = (hCenter / 2) + (hEnd / 2);

  // Lathe는 이미 Y축 정렬됨. 위치만 이동.

  hexTop.position.set(0, offset, 0); 
  mainMesh.add(hexTop);

  // (2) 아래쪽
  const hexBottom = createChamferedPoly(rEnd, hEnd, 8);
  hexBottom.position.set(0, -offset, 0); 
  mainMesh.add(hexBottom);


  // --- 4. 속성 ---
  mainMesh.userData = {
      isFitting: true,    
      isPipe: false,      
      kind: "union",     
      subKind: "15a",     
      stlName: "Union15A_Chamfer",

      snapPoints: [
        { pos: [0, halfLen, 0], normal: [0, 1, 0] },   
        { pos: [0, -halfLen, 0], normal: [0, -1, 0] }  
      ],
      
      threadCenters: {
        port1: [0, halfLen, 0],
        port2: [0, -halfLen, 0]
      }

  });

  draggable.push(mainMesh);

  });

  // --- 2. 본체: 육각 머리 (Hex Head) ---
  function createChamferedHex() {

    pts.push(new THREE.Vector2(0, -hHex/2));
    pts.push(new THREE.Vector2(rHex - hChamfer, -hHex/2)); // 바닥 모따기

    pts.push(new THREE.Vector2(rHex - hChamfer, hHex/2));
    pts.push(new THREE.Vector2(0, hHex/2));

    const geo = new THREE.LatheGeometry(pts, 6); // 6각
    geo.computeVertexNormals();
    return new THREE.Mesh(geo, matHex);
  }

  const mainMesh = createChamferedHex();
  // 정면 정렬 (PI/6 = 30도)

/* =================================================================

   - 밴드 모따기(Chamfer) 1mm 유지
   - 스냅 포인트 보정(4.5mm Out) 유지
   - [변경] 모델 중심점 보정 (제자리 회전)
   ================================================================= */
window.spawnProcedural45Elbow20A = function() {
  saveState(); 

  const MM_PER_UNIT = 100;

  // 1. 규격 설정 (20A) - 기존 값 유지
  const ELBOW_RADIUS_MM = 41.8; 
  const BODY_DIA_MM = 34;     
  const BAND_DIA_MM = 39;     
  const BAND_HEIGHT_MM = 9;   
  const CHAMFER_MM = 1; 

  const R_MAIN = ELBOW_RADIUS_MM / MM_PER_UNIT; 
  const rBody = (BODY_DIA_MM / 2) / MM_PER_UNIT;
  const rBand = (BAND_DIA_MM / 2) / MM_PER_UNIT;
  const hBand = BAND_HEIGHT_MM / MM_PER_UNIT;
  const hChamfer = CHAMFER_MM / MM_PER_UNIT;
  
  // 스냅 보정값
  const snapOffset = hBand / 2; // 4.5mm

  const ANGLE = Math.PI / 4; // 45도

  const mat = new THREE.MeshStandardMaterial({
    color: 0x444444, 
    roughness: 0.9, 
    metalness: 0.0, 
    flatShading: false,
    side: THREE.DoubleSide
  });

  // --- 2. 본체 (토러스) 및 [중심 보정] ---
  const torusGeo = new THREE.TorusGeometry(R_MAIN, rBody, 32, 32, ANGLE);
  
  // [수정] 지오메트리 중심 계산 및 이동 (제자리 회전을 위해 필수)
  torusGeo.computeBoundingBox();
  const centerOffset = new THREE.Vector3();
  torusGeo.boundingBox.getCenter(centerOffset); // 현재 중심점 파악
  torusGeo.center(); // 지오메트리 중심을 (0,0,0)으로 이동

  const mainMesh = new THREE.Mesh(torusGeo, mat);


  // --- 3. 밴드 생성 (기존 함수 유지) ---
  function createChamferedBand() {
    const pts = [];
    pts.push(new THREE.Vector2(0, -hBand/2));
    pts.push(new THREE.Vector2(rBand - hChamfer, -hBand/2));
    pts.push(new THREE.Vector2(rBand, -hBand/2 + hChamfer));
    pts.push(new THREE.Vector2(rBand, hBand/2 - hChamfer));
    pts.push(new THREE.Vector2(rBand - hChamfer, hBand/2));
    pts.push(new THREE.Vector2(0, hBand/2));

    const geo = new THREE.LatheGeometry(pts, 32);
    geo.computeVertexNormals();
    return new THREE.Mesh(geo, mat);
  }

  // [수정] 밴드 위치 계산 (centerOffset 만큼 빼줘서 위치 보정)

  // (1) 시작점 밴드
  const bandStart = createChamferedBand();
  const startPos = new THREE.Vector3(R_MAIN, 0, 0);
  startPos.sub(centerOffset); // 중심 이동량만큼 보정

  bandStart.position.copy(startPos);
  // Lathe 기본 Y축 정렬이므로 회전 불필요 (토러스 시작점 Y축 접선과 일치)
  mainMesh.add(bandStart);


  // (2) 끝점 밴드
  const bandEnd = createChamferedBand();
  
  const endX_center = R_MAIN * Math.cos(ANGLE);
  const endY_center = R_MAIN * Math.sin(ANGLE);
  const endPos = new THREE.Vector3(endX_center, endY_center, 0);
  endPos.sub(centerOffset); // 중심 이동량만큼 보정
  
  bandEnd.position.copy(endPos);
  bandEnd.rotation.z = ANGLE; // 45도 회전
  mainMesh.add(bandEnd);


  // --- 4. 스냅 포인트 계산 (중심 보정 적용) ---
  
  // (1) 시작점 (기존 계산값 - offset)
  const startSnapX_raw = R_MAIN;
  const startSnapY_raw = -snapOffset; 
  const p1 = new THREE.Vector3(startSnapX_raw, startSnapY_raw, 0).sub(centerOffset);

  // (2) 끝점 (기존 계산값 - offset)
  const tanX = -Math.sin(ANGLE); 
  const tanY = Math.cos(ANGLE);  
  
  const endSnapX_raw = endX_center + (tanX * snapOffset);
  const endSnapY_raw = endY_center + (tanY * snapOffset);
  const p2 = new THREE.Vector3(endSnapX_raw, endSnapY_raw, 0).sub(centerOffset);

  const nx = tanX;
  const ny = tanY;

  mainMesh.userData = {
      isFitting: true,    
      isPipe: false,      
      kind: "elbow45",     
      subKind: "20a",     
      stlName: "Elbow45_20A_Chamfer",

      snapPoints: [
        { pos: [p1.x, p1.y, p1.z], normal: [0, -1, 0] }, 
        { pos: [p2.x, p2.y, p2.z], normal: [nx, ny, 0] } 
      ],
      
      threadCenters: {
        port1: [p1.x, p1.y, p1.z],
        port2: [p2.x, p2.y, p2.z]
      }
  };

  mainMesh.children.forEach(child => {
      child.userData = Object.assign({}, mainMesh.userData);
  });

  // --- 5. 배치 ---
  placeAtCenterAndGround(mainMesh);
  scene.add(mainMesh);
  draggable.push(mainMesh);

  clearAllSelection();
  selectedSet.add(mainMesh);
  markSelected(mainMesh);
  selectedMesh = mainMesh;

  if (typeof updatePortVisuals === "function") updatePortVisuals(mainMesh);
  updateRotationGizmo();
};

window.spawnProceduralCrossTee20A = function() {

  const MM_PER_UNIT = 100;

  // 1. 규격 설정 (20A 최종)
  const FACE_POS_MM = 32;   // 중심에서 끝단까지 거리
  const BODY_DIA_MM = 34;   
  const BAND_DIA_MM = 39;   
  const BAND_HEIGHT_MM = 9;

  const facePos = FACE_POS_MM / MM_PER_UNIT;

  const rBand = (BAND_DIA_MM / 2) / MM_PER_UNIT;
  const hBand = BAND_HEIGHT_MM / MM_PER_UNIT;
  const hChamfer = CHAMFER_MM / MM_PER_UNIT;

  bandRight.rotation.z = -Math.PI / 2; 
  bandRight.position.set(offset, 0, 0); 
  mainMesh.add(bandRight);

        { pos: [facePos, 0, 0], normal: [1, 0, 0] },   // 오른쪽
        { pos: [-facePos, 0, 0], normal: [-1, 0, 0] }  // 왼쪽
      ],
      
      threadCenters: {
        port1: [0, facePos, 0],
        port2: [0, -facePos, 0],
        port3: [facePos, 0, 0],
        port4: [-facePos, 0, 0]
      }

      child.userData = Object.assign({}, mainMesh.userData);

// 🔴 여기에 이 줄을 추가하세요! (스냅 보정용 이름표)

window.spawnProceduralFlange20A = function() {

  const FLANGE_OD_MM = 100;      
  const FLANGE_THK_MM = 14;      
  const HUB_OD_MM = 42;          
  const HUB_LEN_MM = 10;         
  const BOLT_BCD_MM = 75;        
  const HOLE_DIA_MM = 15;        
  const CHAMFER_MM = 1; // [추가] 모따기 1mm
  
  const rFlange = (FLANGE_OD_MM / 2) / MM_PER_UNIT;
  const hDisk = FLANGE_THK_MM / MM_PER_UNIT;
  const rHub = (HUB_OD_MM / 2) / MM_PER_UNIT;
  const hHub = HUB_LEN_MM / MM_PER_UNIT;
  const rBolt = (BOLT_BCD_MM / 2) / MM_PER_UNIT;
  const rHole = (HOLE_DIA_MM / 2) / MM_PER_UNIT;
  const hChamfer = CHAMFER_MM / MM_PER_UNIT;

  const mat = new THREE.MeshStandardMaterial({
    color: 0x444444, 
    roughness: 0.9, 
    metalness: 0.0, 
    flatShading: false,
    side: THREE.DoubleSide
  });
  
  const matBolt = new THREE.MeshStandardMaterial({
    color: 0x222222, 
    roughness: 1.0 
  });

  // --- 2. 본체: 원판 (Chamfered Disk) ---
  function createChamferedDisk() {
    const pts = [];
    // 반시계 방향 단면 (중심 -> 오른쪽 바닥 -> 오른쪽 위(모따기) -> 중심)
    pts.push(new THREE.Vector2(0, -hDisk/2));
    pts.push(new THREE.Vector2(rFlange, -hDisk/2));
    pts.push(new THREE.Vector2(rFlange, hDisk/2 - hChamfer)); // 모따기 시작
    pts.push(new THREE.Vector2(rFlange - hChamfer, hDisk/2)); // 모따기 끝
    pts.push(new THREE.Vector2(0, hDisk/2));

    const geo = new THREE.LatheGeometry(pts, 64);
    geo.computeVertexNormals();
    return new THREE.Mesh(geo, mat);
  }

  const mainMesh = createChamferedDisk();


  // --- 3. 자식 부품 ---

  // (1) 허브 (Chamfered Hub)

    const pts = [];
    pts.push(new THREE.Vector2(0, -hHub/2));

  for(let i=0; i<4; i++) {
      const angle = (Math.PI / 2) * i;
      const bx = Math.cos(angle) * rBolt;
      const bz = Math.sin(angle) * rBolt;
      
      const bolt = new THREE.Mesh(boltGeo, matBolt);
      bolt.position.set(bx, 0, bz); 
      mainMesh.add(bolt);
  }

  // --- 4. 속성 설정 ---
  mainMesh.userData = {
      isFitting: true,    
      isPipe: false,      
      kind: "flange",     
      subKind: "20a",     
      stlName: "Flange20A_Chamfer",

      snapPoints: [
        { pos: [0, -hDisk/2, 0], normal: [0, -1, 0] },
        { pos: [0, (hDisk/2 + hHub), 0], normal: [0, 1, 0] }
      ],
      threadCenters: {
        port1: [0, -hDisk/2, 0],
        port2: [0, (hDisk/2 + hHub), 0]
      }
  };

  mainMesh.children.forEach(child => {
      child.userData = Object.assign({}, mainMesh.userData);
  });

  scene.add(mainMesh);
  draggable.push(mainMesh);

  selectedSet.add(mainMesh);
  markSelected(mainMesh);
  selectedMesh = mainMesh;

  updateRotationGizmo();
};

        port1: [0, -(hHead/2 + hBody), 0]
      }
  };

  mainMesh.children.forEach(child => {
      child.userData = Object.assign({}, mainMesh.userData);
  });

  placeAtCenterAndGround(mainMesh);
  scene.add(mainMesh);
  draggable.push(mainMesh);
  clearAllSelection();
  selectedSet.add(mainMesh);
  markSelected(mainMesh);
  selectedMesh = mainMesh;
  if (typeof updatePortVisuals === "function") updatePortVisuals(mainMesh);
  updateRotationGizmo();
};



/* ========== mm 큐브 부속 생성 (All Chamfer / 모든 면 모따기) ========== */
function addMmCubeFitting(sizeMm) {
  saveState();

  const mm = parseFloat(sizeMm);
  if (!mm || mm <= 0) return;

  const MM_PER_UNIT = 100;
  const unit = mm / MM_PER_UNIT;
  
  // 모따기 크기 (1mm)
  const chamfer = 0.2 / MM_PER_UNIT;

  // ── Geometry: "이중 모따기" 기법 적용 ──
  // 1. 2D 모양을 '팔각형(모서리가 깎인 사각형)'으로 만듭니다. (옆면 4개 모따기 효과)
  // 2. Extrude 설정에서 'bevel'을 켭니다. (앞/뒤 8개 모서리 모따기 효과)
  // 결과적으로 12개 모서리가 모두 깎인 주사위 모양이 됩니다.

  // 베벨이 추가될 것을 고려하여 기본 크기를 줄임
  // (전체크기 - 모따기*2)
  const baseSize = unit - (chamfer * 2); 
  const half = baseSize / 2;

  const shape = new THREE.Shape();
  
  // [팔각형 그리기]
  // 왼쪽 아래부터 시계 반대방향으로 그림
  shape.moveTo(-half, -half + chamfer);       // 1. 좌측 하단 (위)
  shape.lineTo(-half + chamfer, -half);       // 2. 좌측 하단 (우)
  shape.lineTo( half - chamfer, -half);       // 3. 우측 하단 (좌)
  shape.lineTo( half, -half + chamfer);       // 4. 우측 하단 (위)
  shape.lineTo( half,  half - chamfer);       // 5. 우측 상단 (아래)
  shape.lineTo( half - chamfer,  half);       // 6. 우측 상단 (좌)
  shape.lineTo(-half + chamfer,  half);       // 7. 좌측 상단 (우)
  shape.lineTo(-half,  half - chamfer);       // 8. 좌측 상단 (아래)
  shape.lineTo(-half, -half + chamfer);       // 닫기

  const extrudeSettings = {
    depth: baseSize,        // 깊이 (Z축 방향, 베벨 제외 길이)
    bevelEnabled: true,     // 베벨 켜기
    bevelThickness: chamfer,// 앞/뒤 방향 모따기 두께
    bevelSize: chamfer,     // 옆 방향 확장 크기
    bevelSegments: 1,       // [중요] 1 = 평평하게 깎음 (Chamfer)
    steps: 1
  };

  const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
  
  // 중심 정렬
  geo.center(); 

  // ── Material ──
  const mat = new THREE.MeshStandardMaterial({
    color: 0xbfc3c7,      
    roughness: 0.25,      
    metalness: 0.25,      
    emissive: 0x111111,   
    emissiveIntensity: 0.35,
    flatShading: true     // 각진 면이 잘 보이도록 설정
  });

  const cube = new THREE.Mesh(geo, mat);

  // ── Position ──
  cube.position.set(0, unit / 2, 0);

  // ── userData ──
  cube.userData.isFitting = true;
  cube.userData.type = "mmCube";
  cube.userData.sizeMm = mm;

  // ── Snap Points ──
  // 실제 unit 크기 기준
  const snapHalf = unit / 2;
  cube.userData.snapPoints = [
    { pos: [ snapHalf, 0, 0], normal: [ 1, 0, 0] }, // +X
    { pos: [-snapHalf, 0, 0], normal: [-1, 0, 0] }, // -X
    { pos: [0,  snapHalf, 0], normal: [0,  1, 0] }, // +Y
    { pos: [0, -snapHalf, 0], normal: [0, -1, 0] }, // -Y
    { pos: [0, 0,  snapHalf], normal: [0, 0,  1] }, // +Z
    { pos: [0, 0, -snapHalf], normal: [0, 0, -1] }  // -Z
  ];

  // ── Scene 등록 ──
  placeAtCenterAndGround(cube);
  scene.add(cube);
  draggable.push(cube);

  clearAllSelection();
  selectedSet.add(cube);
  markSelected(cube);
  selectedMesh = cube;
  updateRotationGizmo();

  return cube;
}

/* ========== 복사 / 삭제 / 전체 삭제 ========== */
/* ============================================
   선택된 부속들을 하나의 STL 파일로 내보내기
   - selectedSet 에 있는 것들 + selectedMesh
   - 내부 Mesh 들까지 worldMatrix 적용 후 STL 생성
   - 내보낼 때 X축 기준 -90도 회전 (파란축 정면)
============================================ */

function exportSelectedToSTL() {
  const targets =
    selectedSet.size > 0 ? [...selectedSet] :
    (selectedMesh ? [selectedMesh] : []);

  if (targets.length === 0) {
    alert("먼저 STL로 저장할 부속을 하나 이상 선택하세요.");
    return;
  }

  const worldGeometries = [];

  targets.forEach(obj => {
    obj.updateWorldMatrix(true, false);

    obj.traverse(child => {
      if (!child.isMesh || !child.geometry) return;

      const g = child.geometry.clone();
      g.applyMatrix4(child.matrixWorld);

      // ✅ 안전장치: 이상값/빈 지오메트리 방지
      const pos = g.getAttribute("position");
      if (!pos || pos.count < 3) return;

      worldGeometries.push(g);
    });
  });

  if (worldGeometries.length === 0) {
    alert("선택된 부속에서 내보낼 메시가 없습니다.");
    return;
  }

  // ✅ 1) 축 보정(기존 유지)
  const rot = new THREE.Matrix4().makeRotationX(Math.PI / 2);

  // ✅ 2) 스케치업용 스케일 업(너무 작으면 실패하는 경우가 많음)
  const EXPORT_SCALE = 100;
  const scl = new THREE.Matrix4().makeScale(EXPORT_SCALE, EXPORT_SCALE, EXPORT_SCALE);

  worldGeometries.forEach(g => {
    g.applyMatrix4(rot);
    g.applyMatrix4(scl);
  });

  // ✅ 3) 바이너리 STL 생성 + 다운로드
  const stlBuffer = buildBinaryStlFromGeometries(worldGeometries);
  downloadBinaryFile("pipe3d_export.stl", stlBuffer);
}
function buildBinaryStlFromGeometries(geometries) {
  // 먼저 전체 triangle 개수 계산
  let triCount = 0;

  geometries.forEach(geo => {
    let g = geo;
    if (g.index) g = g.toNonIndexed();
    const pos = g.getAttribute("position");
    if (!pos) return;
    triCount += Math.floor(pos.count / 3);
  });

  // STL 바이너리 포맷: 80바이트 헤더 + 4바이트 triCount + (triCount * 50바이트)
  const buffer = new ArrayBuffer(84 + triCount * 50);
  const dv = new DataView(buffer);

  // 80바이트 헤더 (아무 문자열/0으로 채워도 됨)
  const header = "pipe3d_export_binary";
  for (let i = 0; i < 80; i++) {
    dv.setUint8(i, i < header.length ? header.charCodeAt(i) : 0);
  }

  dv.setUint32(80, triCount, true);

  let offset = 84;

  const vA = new THREE.Vector3();
  const vB = new THREE.Vector3();
  const vC = new THREE.Vector3();
  const cb = new THREE.Vector3();
  const ab = new THREE.Vector3();
  const n  = new THREE.Vector3();

  geometries.forEach(geo => {
    let g = geo;
    if (g.index) g = g.toNonIndexed();

    const pos = g.getAttribute("position");
    if (!pos) return;

    // normal이 없으면 계산
    if (!g.getAttribute("normal")) g.computeVertexNormals();

    for (let i = 0; i < pos.count; i += 3) {
      vA.fromBufferAttribute(pos, i);
      vB.fromBufferAttribute(pos, i + 1);
      vC.fromBufferAttribute(pos, i + 2);

      // 면 노멀(스케치업에서 더 안정적인 편)
      cb.subVectors(vC, vB);
      ab.subVectors(vA, vB);
      n.copy(cb.cross(ab));
      if (n.lengthSq() > 0) n.normalize();
      else n.set(0, 0, 0);

      // normal (12 bytes)
      dv.setFloat32(offset,     n.x, true);
      dv.setFloat32(offset + 4, n.y, true);
      dv.setFloat32(offset + 8, n.z, true);
      offset += 12;

      // vA, vB, vC (each 12 bytes)
      dv.setFloat32(offset,     vA.x, true);
      dv.setFloat32(offset + 4, vA.y, true);
      dv.setFloat32(offset + 8, vA.z, true);
      offset += 12;

      dv.setFloat32(offset,     vB.x, true);
      dv.setFloat32(offset + 4, vB.y, true);
      dv.setFloat32(offset + 8, vB.z, true);
      offset += 12;

      dv.setFloat32(offset,     vC.x, true);
      dv.setFloat32(offset + 4, vC.y, true);
      dv.setFloat32(offset + 8, vC.z, true);
      offset += 12;

      // attribute byte count (2 bytes)
      dv.setUint16(offset, 0, true);
      offset += 2;
    }
  });

  return buffer;
}

function downloadBinaryFile(filename, arrayBuffer) {
  const blob = new Blob([arrayBuffer], { type: "application/octet-stream" });
  const url  = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.style.display = "none";
  a.href = url;
  a.download = filename;

  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  URL.revokeObjectURL(url);
}



/* 여러 개의 BufferGeometry → 하나의 ASCII STL 문자열로 만들기 */
function buildASCIIStlFromGeometries(geometries, solidName) {
  let lines = [];
  lines.push("solid " + (solidName || "export"));

  const vA = new THREE.Vector3();
  const vB = new THREE.Vector3();
  const vC = new THREE.Vector3();
  const cb = new THREE.Vector3();
  const ab = new THREE.Vector3();

  geometries.forEach(geo => {
    let g = geo;
    if (g.index) {
      g = g.toNonIndexed();
    }

    const pos = g.getAttribute("position");
    let nor = g.getAttribute("normal");

    if (!nor) {
      g.computeVertexNormals();
      nor = g.getAttribute("normal");
    }

    for (let i = 0; i < pos.count; i += 3) {
      vA.fromBufferAttribute(pos, i);
      vB.fromBufferAttribute(pos, i + 1);
      vC.fromBufferAttribute(pos, i + 2);

      let nx, ny, nz;
      if (nor) {
        nx = nor.getX(i);
        ny = nor.getY(i);
        nz = nor.getZ(i);
      } else {
        cb.subVectors(vC, vB);
        ab.subVectors(vA, vB);
        cb.cross(ab).normalize();
        nx = cb.x; ny = cb.y; nz = cb.z;
      }

      lines.push(`  facet normal ${nx} ${ny} ${nz}`);
      lines.push(`    outer loop`);
      lines.push(`      vertex ${vA.x} ${vA.y} ${vA.z}`);
      lines.push(`      vertex ${vB.x} ${vB.y} ${vB.z}`);
      lines.push(`      vertex ${vC.x} ${vC.y} ${vC.z}`);
      lines.push(`    endloop`);
      lines.push(`  endfacet`);
    }
  });

  lines.push("endsolid " + (solidName || "export"));
  return lines.join("\n");
}

/* 문자열을 파일로 다운로드시키는 유틸 */
function downloadTextFile(filename, text) {
  const blob = new Blob([text], { type: "application/octet-stream" });
  const url  = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.style.display = "none";
  a.href = url;
  a.download = filename;

  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  URL.revokeObjectURL(url);
}








function cloneSelected(){
  if (selectedSet.size === 0 && !selectedMesh) {
    alert("먼저 복사할 개체를 선택하세요 (클릭).");
    return;
  }
  saveState();

  const targets = selectedSet.size > 0 ? [...selectedSet] : [selectedMesh];
  clearAllSelection();

  let lastClone = null;
  targets.forEach(src=>{
    const clone = src.clone(true);
    clone.userData = {...src.userData};
    makeMaterialsUnique(clone);
    clone.position.add(new THREE.Vector3(0.3, 0, 0.3));
    scene.add(clone);
    draggable.push(clone);

    selectedSet.add(clone);
    markSelected(clone);
    lastClone = clone;
  });

  selectedMesh = lastClone;
  updateRotationGizmo();
}

function deleteSelected(){
  if (selectedSet.size === 0 && !selectedMesh) return;
  saveState();

  const targets = selectedSet.size > 0 ? [...selectedSet] : [selectedMesh];
  targets.forEach(m => {
    unmarkSelected(m);
    scene.remove(m);
    const idx = draggable.indexOf(m);
    if (idx !== -1) draggable.splice(idx, 1);
  });
  selectedSet.clear();
  selectedMesh = null;
  updateRotationGizmo();
}

function clearScene(){
  saveState();

  const keep = new Set([grid, ambient, dirLight, rotationGizmo]);
  scene.children.slice().forEach(obj=>{
    if (!keep.has(obj)) scene.remove(obj);
  });
  draggable.length = 0;
  selectedSet.clear();
  selectedMesh = null;
  updateRotationGizmo();
}

/* ========== 그룹 만들기 / 해제 ========== */
function groupSelected() {
  if (selectedSet.size < 2) {
    alert("그룹으로 묶을 개체를 2개 이상 선택하세요. (Ctrl+클릭)");
    return;
  }
  saveState();

  const objects = [...selectedSet];

  const center = new THREE.Vector3();
  objects.forEach(o => {
    const wp = new THREE.Vector3();
    o.getWorldPosition(wp);
    center.add(wp);
  });
  center.multiplyScalar(1/objects.length);

  const group = new THREE.Group();
  group.position.copy(center);

  objects.forEach(o => {
    const wp = new THREE.Vector3();
    o.getWorldPosition(wp);

    unmarkSelected(o);
    const idx = draggable.indexOf(o);
    if (idx !== -1) draggable.splice(idx,1);

    scene.remove(o);
    group.add(o);

    o.position.copy(wp);
    o.position.sub(center);
  });

  scene.add(group);
  draggable.push(group);

  selectedSet.clear();
  selectedMesh = group;
  selectedSet.add(group);
  markSelected(group);
  updateRotationGizmo();
}

function ungroupSelected() {
  if (!selectedMesh || !(selectedMesh instanceof THREE.Group)) {
    alert("현재 선택된 객체가 그룹이 아닙니다.");
    return;
  }
  saveState();

  const group = selectedMesh;

  // [핵심 수정 1] 그룹을 깨기 전에, 그룹에 그려진 노란 점선을 먼저 깔끔하게 지웁니다.
  unmarkSelected(group);

  group.updateWorldMatrix(true, false);

  const children = group.children.slice();

  children.forEach(child => {
    // [핵심 수정 2] 자식 부품들에 혹시라도 남아있을 수 있는 점선 잔재를 제거합니다.
    if (typeof stripSelectionOutlineDeep === "function") {
        stripSelectionOutlineDeep(child);
    } else {
        // 함수가 없을 경우 수동 제거
        if (child.userData && child.userData.selectionOutline) {
            child.remove(child.userData.selectionOutline);
            delete child.userData.selectionOutline;
        }
    }

    child.updateWorldMatrix(true, false);
    const worldMatrix = child.matrixWorld.clone();

    group.remove(child);
    scene.add(child);

    // 월드 좌표 유지
    worldMatrix.decompose(child.position, child.quaternion, child.scale);

    draggable.push(child);
  });

  // 그룹 껍데기 삭제
  const idx = draggable.indexOf(group);
  if (idx !== -1) draggable.splice(idx, 1);
  scene.remove(group);

  // 자식들 개별 선택 상태로 변경
  clearAllSelection();
  children.forEach(ch => {
    selectedSet.add(ch);
    markSelected(ch);
  });
  selectedMesh = children[children.length - 1] || null;
  
  // 🔹 윤곽선 및 기즈모 업데이트
  if(typeof setSelectedObject === "function") setSelectedObject(selectedMesh);
  updateRotationGizmo();
}

/* ========== 자석: 체인 방식 (위치만) ========== */
function attachSelectedGroup() {
  const arr = [...selectedSet];
  if (arr.length < 2) {
    alert("두 개 이상 선택 후 A를 누르거나 버튼을 눌러주세요.");
    return;
  }

  saveState();

  function collectAttachPoints(obj) {
    const pts = [];
    if (obj.geometry) {
      pts.push(...getWorldAttachPointsForMesh(obj));
    } else if (obj instanceof THREE.Group) {
      obj.traverse(child => {
        if (child.geometry) pts.push(...getWorldAttachPointsForMesh(child));
      });
    }
    return pts;
  }

  function attachPair(anchor, target) {
  // ✅ 월드행렬 최신화(그룹+그룹에서 핵심)
  anchor.updateWorldMatrix(true, false);
  target.updateWorldMatrix(true, false);

  const anchorPts = collectAttachPoints(anchor);
  const myPts     = collectAttachPoints(target);
  if (!anchorPts.length || !myPts.length) return;

  let bestDist = Infinity;
  let bestA = null;
  let bestB = null;

  for (let i = 0; i < anchorPts.length; i++) {
    const ap = anchorPts[i];
    for (let j = 0; j < myPts.length; j++) {
      const mp = myPts[j];
      const d = ap.distanceTo(mp);
      if (d < bestDist) {
        bestDist = d;
        bestA = ap;
        bestB = mp;
      }
    }
  }

  if (!bestA || !bestB) return;

  const delta = new THREE.Vector3().subVectors(bestA, bestB);
  target.position.add(delta);

  // ✅ 이동 후에도 최신화
  target.updateWorldMatrix(true, false);
}


  for (let i = 1; i < arr.length; i++) {
    attachPair(arr[i - 1], arr[i]);
  }

  updateRotationGizmo();
}

// 개체(메시/그룹)의 월드 기준 중심점 구하기
function getObjectCenterWorld(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const center = new THREE.Vector3();
  box.getCenter(center);
  return center;
}

/* ========== 선택 개체 정렬 유틸 (경계선 기준 수정 버전) ========== */
/* =================================================================
   [수정 완료] 정렬 통합 함수 (함수명: alignSelectionAxis)
   - HTML 버튼(onclick="alignSelectionAxis(...)")과 이름 일치시킴
   - 기준: 첫 번째 선택한 객체 (list[0]) 고정
   - 나머지 객체들이 기준 객체 위치로 이동
   ================================================================= */
window.alignSelectionAxis = function(axis) {
    // 1. 선택된 객체가 2개 이상일 때만 작동
    if (selectedSet.size < 2) return;

    saveState(); // 상태 저장

    // Set을 배열로 변환 (순서 보장: list[0]이 첫 번째로 선택한 객체)
    const list = Array.from(selectedSet);
    
    // [핵심] 기준(Anchor)은 무조건 첫 번째 선택한 객체
    const target = list[0]; 

    // 기준 객체의 중심점 계산
    if (typeof updateBox === "function") updateBox(target);
    if (!target.geometry.boundingBox) target.geometry.computeBoundingBox();
    
    const targetBox = new THREE.Box3().setFromObject(target);
    const targetCenter = new THREE.Vector3();
    targetBox.getCenter(targetCenter); // 기준점(Target)의 센터

    // 2. 나머지 객체들(list[1]부터 끝까지)을 이동
    for (let i = 1; i < list.length; i++) {
        const mover = list[i];
        
        // 이동할 객체의 중심점 계산
        if (typeof updateBox === "function") updateBox(mover);
        const moverBox = new THREE.Box3().setFromObject(mover);
        const moverCenter = new THREE.Vector3();
        moverBox.getCenter(moverCenter); // 이동할 놈(Mover)의 센터

        // 이동해야 할 거리(Diff) = 기준점 - 현재점
        const diff = new THREE.Vector3().subVectors(targetCenter, moverCenter);

        // 3. 축(axis)에 따라 이동 적용
        if (axis === 'center') {
            // [Center] X, Y, Z 모든 축을 기준점 중심으로 이동
            mover.position.add(diff);
        } 
        else if (axis === 'x') {
            // [X축 정렬] Y, Z는 놔두고 X만 기준점에 맞춤
            mover.position.x += diff.x; 
        }
        else if (axis === 'y') {
            // [Y축 정렬]
            mover.position.y += diff.y;
        }
        else if (axis === 'z') {
            // [Z축 정렬]
            mover.position.z += diff.z;
        }
        
        // 이동 후 시각적 요소(포트 등) 업데이트
        if (typeof updatePortVisuals === "function") updatePortVisuals(mover);
    }

    // 모든 작업 후 기즈모 갱신
    updateRotationGizmo();
};





/* ========== 화면 좌표 → Raycaster ========== */
function setMouseFromEvent(e){
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const y = (e.clientY - rect.top)  / rect.height;
  mouse.x = x * 2 - 1;
  mouse.y = -(y * 2 - 1);
}

/* 최상위 draggable 찾기 */
function findTopDraggable(obj) {
  let cur = obj;
  while (cur && !draggable.includes(cur)) {
    cur = cur.parent;
  }
  return cur || obj;
}

/* ========== 선택 기준 시점 이동 ========== */
function focusOnSelection() {
  const targets = selectedSet.size > 0 ? [...selectedSet] : (selectedMesh ? [selectedMesh] : []);
  if (targets.length === 0) return;

  // 1. 선택된 모든 개체를 포함하는 영역(Box) 계산
  const box = new THREE.Box3();
  targets.forEach(obj => {
    box.expandByObject(obj);
  });

  const center = new THREE.Vector3();
  box.getCenter(center); // 개체들의 중심점
  const size = new THREE.Vector3();
  box.getSize(size);    // 개체들의 전체 크기

  // 2. 개체 크기에 따른 적절한 거리 계산
  // 개체의 대각선 길이를 구해서 그보다 약간 더 멀리 배치 (화면에 꽉 차게)
  const maxDim = Math.max(size.x, size.y, size.z);
  const fov = camera.fov * (Math.PI / 180);
  
  // 물체가 화면에 적당히 들어오는 거리 계산 (여유계수 1.5)
  let newRadius = maxDim / (2 * Math.tan(fov / 2)) * 0.8;

  // 너무 작은 물체나 너무 큰 물체일 경우 최소/최대 거리 제한
  newRadius = Math.max(newRadius, 2); 

  // 3. 카메라 좌표 및 타겟 업데이트
  camTarget.copy(center); // 회전 중심을 개체 중심으로
  radius = newRadius;     // 거리를 개체 앞으로 당김

  // 4. 즉시 카메라 반영
  updateCamera();
  
  console.log("개체 보기 실행: 거리", Math.round(radius));
}

canvas.addEventListener("touchstart", (e) => {
  if (e.touches.length === 1) {
    const touch = e.touches[0];
    // 가상의 마우스 왼쪽 버튼 클릭(button: 0) 이벤트를 만들어서 mousedown 로직 실행
    const mouseEvent = new MouseEvent("mousedown", {
      clientX: touch.clientX,
      clientY: touch.clientY,
      button: 0
    });
    canvas.dispatchEvent(mouseEvent);
  }
}, { passive: false });

canvas.addEventListener("touchmove", (e) => {
  if (e.touches.length === 1) {
    e.preventDefault(); // 스크롤 방지
    const touch = e.touches[0];
    // 가상의 mousemove 이벤트 생성
    const mouseEvent = new MouseEvent("mousemove", {
      clientX: touch.clientX,
      clientY: touch.clientY
    });
    window.dispatchEvent(mouseEvent);
  }
}, { passive: false });

canvas.addEventListener("touchend", (e) => {

/* ========== 마우스 이벤트 ========== */
/* ========== 마우스 이벤트 ========== */
canvas.addEventListener("mousedown", e => {
  lastX = e.clientX;
  lastY = e.clientY;

  // 가운데 버튼 (휠 클릭): 평행이동(Pan) / Shift+클릭시 높이이동(Elevate)
  if (e.button === 1) {
    e.preventDefault();
    dragging = true;
    
    // [수정됨] 뒤에 붙어있던 'orbit' 글자 삭제함
    dragMode = e.shiftKey ? "elevate" : "pan"; 
    return;
  }

  // 오른쪽 버튼: 회전(Orbit)
  if (e.button === 2) {
    e.preventDefault();
    dragging = true;
    dragMode = "orbit";
    return;
  }


  

  // 왼쪽 버튼만 아래 로직 진행 (선택, 생성 등)
  if (e.button !== 0) return;

  setMouseFromEvent(e);

  // 회전 Gizmo
  if (rotationGizmo && rotationGizmo.visible && gizmoEnabled && (hitRingX || hitRingY || hitRingZ)) {
    raycaster.setFromCamera(mouse, camera);
    const gizmoHits = raycaster.intersectObjects([hitRingX, hitRingY, hitRingZ], true);

    if (gizmoHits.length > 0 && (selectedMesh || selectedSet.size > 0)) {
      const hitObj = gizmoHits[0].object;
      const axis = hitObj.userData.axis || "y";
      rotateAxis = axis;

      // 이번 회전에 사용할 월드 축
      if (rotateAxis === "x")      rotateWorldAxis.set(1, 0, 0);
      else if (rotateAxis === "y") rotateWorldAxis.set(0, 1, 0);
      else if (rotateAxis === "z") rotateWorldAxis.set(0, 0, 1);

      saveState();
      dragging = true;
      dragMode = "rotate";

      // 회전 중심(화면 좌표)
      const centerWorld = rotationGizmo.position.clone();
      const proj = centerWorld.project(camera);
      rotateCenterScreen.set(
        ( proj.x * 0.5 + 0.5 ) * window.innerWidth,
        (-proj.y * 0.5 + 0.5 ) * window.innerHeight
      );

      const sx = e.clientX;
      const sy = e.clientY;
      rotateStartAngle = Math.atan2(sy - rotateCenterScreen.y, sx - rotateCenterScreen.x);

      // 초기 쿼터니언 저장
      initialRotations.clear();
      const targets = selectedSet.size > 0 ? [...selectedSet] : [selectedMesh];
      targets.forEach(o => {
        initialRotations.set(o, o.quaternion.clone());
      });

      hoveredAxis = rotateAxis;
      updateRingHoverVisuals(hoveredAxis);

      if (angleUI) {
        angleUI.style.display = "block";
        angleUI.textContent = rotateAxis.toUpperCase() + " 0°";
        angleUI.style.left = rotateCenterScreen.x + "px";
        angleUI.style.top  = (rotateCenterScreen.y - 60) + "px";
      }
      return;
    }
  }

  // 일반 선택 / 이동 / 드래그 박스
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(draggable, true);

  if (hits.length > 0) {
    const hit = hits[0];
    const target = findTopDraggable(hit.object);

    if (e.ctrlKey || e.metaKey) {
      toggleSelect(target);
    } else {
      if (selectedSet.size > 1 && selectedSet.has(target)) {
        selectedMesh = target;
      } else {
        selectOnly(target);
      }
    }

    const anchor = selectedMesh || target;

    movePlane.set(new THREE.Vector3(0,1,0), 0);
    raycaster.setFromCamera(mouse, camera);
    if (raycaster.ray.intersectPlane(movePlane, planeHit)) {
      dragOffset.copy(anchor.position).sub(planeHit);
    } else {
      dragOffset.set(0, anchor.position.y, 0);
    }

    saveState();
    dragging = true;
    dragMode = "move";

  } else {
    // 빈 공간 클릭 → 선택 해제 + 박스 선택 시작
    clearAllSelection();
    createSelectionRect(e.clientX, e.clientY, e.ctrlKey || e.metaKey);

    dragging = true;
    dragMode = "rect";
  }
});




/* =================================================================
   2026-01-12: 더블 클릭 이벤트 개선
      - 다중 선택 상태에서 파이프 더블 클릭 시 선택 유지
      - 그룹/다중 선택된 파이프 일괄 리사이즈 연결
   ================================================================= */
canvas.addEventListener("dblclick", (e) => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const hits = raycaster.intersectObjects(draggable, true);
  if (!hits.length) return;

  // 최상위 객체(그룹 or 부속) 찾기
  let obj = hits[0].object;
  while (obj && !draggable.includes(obj) && obj.parent) obj = obj.parent;
  if (!obj) return;

  // ✅ [핵심 수정] 이미 선택된 그룹/파이프를 클릭했다면 선택을 풀지 않음
  const isAlreadySelected = selectedSet.has(obj);
  
  // 만약 선택되지 않은 걸 더블클릭했다면 -> 그것만 단독 선택 (기존 로직)
  // 만약 이미 선택된 것 중 하나라면 -> 다중 선택 유지
  if (!isAlreadySelected) {
     selectOnly(obj);
  }

  // 1. 파이프 리사이즈 (단일/다중/그룹 모두 대응)
  // 선택된 것들 중에 파이프가 하나라도 있으면 리사이즈 시도
  const targets = (selectedSet.size > 0) ? [...selectedSet] : [selectedMesh];
  const hasPipe = targets.some(t => {
      // 본체가 파이프거나, 그룹 내부에 파이프가 있거나
      if (t.userData?.isPipe) return true;
      if (t instanceof THREE.Group) {
          let found = false;
          t.traverse(c => { if(c.userData?.isPipe) found = true; });
          return found;
      }
      return false;
  });

  if (hasPipe) {

let lastUpTime = 0;
let lastUpX = 0;
let lastUpY = 0;

window.addEventListener("mouseup", e => {
  if (e.button !== 0) return;

  const now = performance.now();
  const dx = Math.abs(e.clientX - lastUpX);
  const dy = Math.abs(e.clientY - lastUpY);

  // 이동이 있었으면 클릭 취소
  if (dx > 4 || dy > 4) {
    lastUpTime = now;
    lastUpX = e.clientX;
    lastUpY = e.clientY;
    return;
  }

  // 더블클릭 판정 (300ms)
  if (now - lastUpTime > 300) {
    lastUpTime = now;
    lastUpX = e.clientX;
    lastUpY = e.clientY;
    return;
  }

  lastUpTime = 0;

  setMouseFromEvent(e);
  raycaster.setFromCamera(mouse, camera);

  const hits = raycaster.intersectObjects(draggable, true);
  if (hits.length === 0) return;

  const target = findTopDraggable(hits[0].object);
  if (!target) return;

  selectOnly(target);
});





canvas.addEventListener("contextmenu", e => e.preventDefault());

window.addEventListener("mousemove", e=>{
  setMouseFromEvent(e);

  const canHover = !(dragging && dragMode === "rotate");

  if (canHover && rotationGizmo && rotationGizmo.visible && gizmoEnabled && (hitRingX || hitRingY || hitRingZ)) {
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects([hitRingX, hitRingY, hitRingZ], true);
    let newAxis = null;
    if (hits.length > 0) {
      const hitObj = hits[0].object;
      newAxis = hitObj.userData.axis || null;
    }
    if (newAxis !== hoveredAxis) {
      hoveredAxis = newAxis;
      updateRingHoverVisuals(hoveredAxis);
    }
  } else if (canHover && hoveredAxis !== null && !(dragging && dragMode === "rotate")) {
    hoveredAxis = null;
    updateRingHoverVisuals(null);
  }

  if (!dragging) return;

  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;

  if (dragMode === "orbit") {
    theta -= dx * 0.001;
    phi   -= dy * 0.001;
    const eps = 0.1;
    phi = Math.max(eps, Math.min(Math.PI-eps, phi));
    updateCamera();

 } else if (dragMode === "pan") {
    const distFromTarget = camera.position.distanceTo(camTarget);
    
    // 최소 거리 보정값을 10으로 대폭 낮춤 (가까운 곳에서 천천히 움직이게)
    const effectiveDist = Math.max(distFromTarget, 10); 

    let worldPerPixel = 
      (effectiveDist * Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * 2) / window.innerHeight;

    // 전체 속도를 0.4배로 낮춤 (매우 부드러워짐)
    worldPerPixel *= 0.2; 

    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    const right = new THREE.Vector3().crossVectors(dir, camera.up).normalize();
    const rightOnPlane = new THREE.Vector3(right.x, 0, right.z).normalize();
    const forwardOnPlane = new THREE.Vector3(dir.x, 0, dir.z).normalize();

    camTarget.addScaledVector(rightOnPlane, -dx * worldPerPixel);
    camTarget.addScaledVector(forwardOnPlane, dy * worldPerPixel);

    updateCamera();





  } else if (dragMode === "move" && (selectedMesh || selectedSet.size > 0)) {
    // ✅ [수정됨] 화면 기준 이동 (어디서든 감도 일정)
    
    // 1. 기준이 될 객체와 카메라 사이의 거리 계산
    const anchor = selectedMesh || [...selectedSet][0];
    const dist = camera.position.distanceTo(anchor.position);

    // 2. 현재 줌(거리)에 맞춰 마우스 이동 감도 자동 조절 (이게 핵심!)
    //    거리가 멀면 빨리 움직이고, 가까우면 정밀하게 움직임
    const vFov = THREE.MathUtils.degToRad(camera.fov);
    const scale = (dist * Math.tan(vFov / 2) * 2) / window.innerHeight;

    // 3. 카메라가 바라보는 방향을 바닥(XZ평면)에 투영
    const camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);
    
    // 앞뒤 방향 (Y축 제거해서 바닥에 붙임)
    const forward = new THREE.Vector3(camDir.x, 0, camDir.z).normalize();
    // 좌우 방향 (앞뒤 벡터와 Y축(0,1,0)의 외적)
    const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

    // 4. 마우스 움직임(dx, dy)만큼 이동 적용
    //    마우스 오른쪽(+) -> Right 벡터 방향
    //    마우스 아래쪽(+) -> Forward 벡터 반대 방향 (뒤로)
    const moveVec = new THREE.Vector3();
    moveVec.addScaledVector(right, dx * scale);
    moveVec.addScaledVector(forward, -dy * scale); // 마우스 위로 올리면 앞으로 가야 하므로 -dy

    // 5. 선택된 모든 물체 이동
    if (snapEnabled) {
      // 스냅 모드일 때는 기존처럼 스냅 적용 (필요시 구현, 여기서는 부드러운 이동 우선)
      // 스냅을 유지하고 싶다면 이동 후 위치를 반올림하는 로직이 추가되어야 하지만,
      // 드래그 감도 문제를 해결하려면 스냅보다는 부드러운 이동이 우선입니다.
      // 원하신다면 나중에 스냅 로직을 여기에 섞어드릴 수 있습니다.
      translateSelection(moveVec.x, 0, moveVec.z); 
    } else {
      translateSelection(moveVec.x, 0, moveVec.z);
    }

  } else if (dragMode === "rect") {
    updateSelectionRect(e.clientX, e.clientY);

 } else if (dragMode === "rotate") {
  const sx = e.clientX;
  const sy = e.clientY;

  // 마우스 현재 각도
  const ang = Math.atan2(sy - rotateCenterScreen.y, sx - rotateCenterScreen.x);

  // 🔁 세 축 전부 같은 방식으로 각도 계산
  let rawDelta = rotateStartAngle - ang;

  const stepDeg = 22.5;
  const stepRad = THREE.MathUtils.degToRad(stepDeg);

  let stepIndex = Math.round(rawDelta / stepRad);
  const snapped = stepIndex * stepRad;

  const targets = selectedSet.size > 0 ? [...selectedSet] : [selectedMesh];

  // 🌎 월드 축 기준 회전 적용
  targets.forEach(obj => {
    const initQ = initialRotations.get(obj);
    if (!initQ) return;

    obj.quaternion.copy(initQ);

    // 🔴 X축만 회전 방향 반대로 적용
    const applied = (rotateAxis === "x") ? -snapped : snapped;
    obj.rotateOnWorldAxis(rotateWorldAxis, applied);
  });

  // ===== HUD 각도 표시 =====
  const absIndex = Math.abs(stepIndex);
  let shownIndex = absIndex;
  if (absIndex > 8) shownIndex = 16 - absIndex;
  let shownDeg = shownIndex * stepDeg;

  let textDeg;
  if (Math.abs(shownDeg - Math.round(shownDeg)) < 1e-6) {
    textDeg = Math.round(shownDeg).toString();
  } else {
    textDeg = shownDeg.toFixed(1);
  }

  if (angleUI) {
    angleUI.style.display = "block";
    angleUI.textContent = `${rotateAxis.toUpperCase()} ${textDeg}°`;
    angleUI.style.left = rotateCenterScreen.x + "px";
    angleUI.style.top  = (rotateCenterScreen.y - 60) + "px";
  }
 if (dimensionEnabled) showDimensionsForSelection(selectedMesh);
}

function isPlateObject(obj) {
  return !!(obj?.userData?.isRectPlate || (obj?.userData?.isPlate && obj?.userData?.plateShape === "circle"));
}

function setObjectOpacityDeep(obj, opacity01) {
  obj.traverse(o => {
    if (!o.isMesh || !o.material) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach(m => {
      if (!m) return;
      m.transparent = (opacity01 < 0.999);
      m.opacity = opacity01;
      m.needsUpdate = true;
    });
  });
}

function setObjectColorDeep(obj, hexColor) {
  obj.traverse(o => {
    if (!o.isMesh || !o.material) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach(m => {
      if (!m) return;
      if (m.color && m.color.set) m.color.set(hexColor);
      m.needsUpdate = true;
    });
  });
}

function getSelectedPlates() {
  const targets = selectedSet.size > 0 ? [...selectedSet] : (selectedMesh ? [selectedMesh] : []);
  return targets.filter(isPlateObject);
}

// ✅ Undo 스택을 슬라이더 드래그 중 “한 번만” 저장하기 위한 플래그
let plateOpacityDragArmed = false;

function applyPlateOpacityFromUI(live = true) {
  const slider = document.getElementById("plateOpacity");
  const label  = document.getElementById("plateOpacityLabel");
  if (!slider) return;

  const v = parseInt(slider.value, 10);
  const opacity = Math.max(0.05, Math.min(1, v / 100));
  if (label) label.textContent = `${v}%`;

  const plates = getSelectedPlates();
  if (!plates.length) return; // 실시간은 조용히 무시(알럿 X)

  // ✅ 드래그 시작 시점에만 saveState() 1회
  if (live && plateOpacityDragArmed) {
    saveState();
    plateOpacityDragArmed = false;
  }

  plates.forEach(p => setObjectOpacityDeep(p, opacity));
}

function getPlateUIChosenColor() {
  const picker = document.getElementById("plateColorPicker");
  if (picker && typeof picker.value === "string" && picker.value.trim()) return picker.value.trim();
  return (typeof window.__lastPlateColor === "string" && window.__lastPlateColor.trim()) ? window.__lastPlateColor.trim() : null;
}

// ✅ "선택 부속/판에 적용" 버튼: 투명도 + 색상 동시에 적용
function applyPlateStyleFromUI() {
  // 1) 선택된 모든 대상(부속 + 판) 가져오기
  let targets = (selectedSet && selectedSet.size > 0) 
                ? Array.from(selectedSet) 
                : (selectedMesh ? [selectedMesh] : []);
  
  if (!targets.length) {
    alert("변경할 부속이나 판을 선택하세요.");
    return;
  }

  // 2) 투명도 값 계산
  const slider = document.getElementById("plateOpacity");
  const label  = document.getElementById("plateOpacityLabel");
  const v = slider ? parseInt(slider.value, 10) : 100;
  const opacity = Math.max(0.05, Math.min(1, (isFinite(v) ? v : 100) / 100));
  if (label && isFinite(v)) label.textContent = `${v}%`;

  // 3) 선택된 색상 가져오기
  const color = getPlateUIChosenColor();

  // 4) 상태 저장 (Undo용)
  saveState(); 

  // 5) 모든 대상에 적용
  targets.forEach(p => {
    // 투명도 적용
    setObjectOpacityDeep(p, opacity);
    // 색상 적용
    if (color) {
      setObjectColorDeep(p, color);
      p.userData = p.userData || {};
      p.userData.color = color; // 저장/복원용
    }
  });

  if (typeof render === "function") render();
}

function applyPlateColor(hex) {
  window.__lastPlateColor = hex;
  const picker = document.getElementById("plateColorPicker");
  if (picker && picker.value !== hex) picker.value = hex;
  try { syncPlateSwatchesFromColor(hex); } catch(e) {}

  // ✅ 수정: 판만 가져오는 게 아니라, 현재 선택된 모든 부속(selectedSet)을 가져옵니다.
  let targets = [];
  if (selectedSet && selectedSet.size > 0) {
    targets = Array.from(selectedSet);
  } else if (selectedMesh) {
    targets = [selectedMesh];
  }

  if (targets.length === 0) return;

  saveState(); // ✅ Undo 1회 저장

  targets.forEach(obj => {
    if (!obj) return;
    // ✅ 판이든 일반 부속이든 내부 메쉬까지 모두 색상 적용
    setObjectColorDeep(obj, hex);  
    
    obj.userData = obj.userData || {};
    obj.userData.color = hex; // 저장/복원용 데이터 기록
  });

  const preview = document.getElementById("plateColorPreview");
  if (preview) preview.style.background = hex;
  
  render(); // 화면 갱신
}

(function bindPlateUI(){
  // ✅ 우측 패널 위에서는 씬(캔버스) 조작 이벤트로 전파되지 않게만 막고,
  //    패널 내부 버튼/슬라이더 클릭은 정상 동작하게 한다.

  const rightPanel = document.getElementById("rightUI"); // ✅ 실제 id
  if (!rightPanel) {
    console.warn("[bindPlateUI] #rightUI 를 찾지 못했습니다.");
    return;
  }

  // ✅ 핵심: capture:false(버블 단계)로 막아야 내부 버튼 클릭이 살아있음
  const blockTypes = [
    "pointerdown","pointermove","pointerup",
    "mousedown","mousemove","mouseup",
    "touchstart","touchmove","touchend",
    "click","dblclick","contextmenu"
  ];

  blockTypes.forEach(type => {
    rightPanel.addEventListener(type, (e) => {
      e.stopPropagation();
      // e.preventDefault(); // ❌ 기본동작(버튼 클릭/포커스)은 살려두는 게 안전
    }, { capture: false });
  });

  // ✅ 휠: 패널 스크롤은 살리고, 씬으로만 안 내려가게
  rightPanel.addEventListener("wheel", (e) => {
    e.stopPropagation();
  }, { capture: false, passive: true });

  // ------------------------------
  // 아래부터는 "있으면 연결 / 없으면 무시" 방식으로 안전하게 바인딩
  // ------------------------------

  // ✅ 팔레트 스와치 생성
  const swWrap = document.getElementById("plateSwatches");
  if (swWrap && typeof PLATE_PALETTE !== "undefined") {
    swWrap.innerHTML = "";
    PLATE_PALETTE.forEach(hex => {
      const d = document.createElement("div");
      d.className = "swatch";
      d.style.background = hex;
      d.title = hex;
      d.addEventListener("click", () => applyPlateColor(hex));
      swWrap.appendChild(d);
    });
  }

  // ✅ 프리뷰 초기색
  const preview = document.getElementById("plateColorPreview");
  if (preview) preview.style.background = preview.style.background || "#4b2e1f";

  // ✅ 투명도 슬라이더
  const slider = document.getElementById("plateOpacity");
  if (slider) {
    slider.addEventListener("pointerdown", () => { plateOpacityDragArmed = true; });
    slider.addEventListener("input", () => { applyPlateOpacityFromUI(true); });
    slider.addEventListener("pointerup", () => { plateOpacityDragArmed = false; });
    slider.addEventListener("change", () => { applyPlateOpacityFromUI(false); });
  }

  // ✅ 컬러피커(네가 주석처리하면 없어질 수 있으니 "있을 때만" 연결)
  const picker = document.getElementById("plateColorPicker");
  if (picker) {
    picker.addEventListener("input", () => {
      const hex = picker.value;
      const pv = document.getElementById("plateColorPreview");
      if (pv) pv.style.background = hex;

      // ✅ 실시간 반영 대상 수정
      let targets = [];
      if (selectedSet && selectedSet.size > 0) {
        targets = Array.from(selectedSet);
      } else if (selectedMesh) {
        targets = [selectedMesh];
      }

      if (!targets.length) return;
      targets.forEach(obj => setObjectColorDeep(obj, hex));
      render();
    });
  }
})();

   - 기본 팔레트는 '빈칸(점선)' 12개
   - 컬러피커에서 색 확정(change) 시: 첫 빈칸을 채움
   - 중복 색이면 해당 칸만 하이라이트/활성
   - localStorage로 저장/복원
========================================================= */
function slots(){
  // DOM 순서(=위에서부터/왼쪽부터) 그대로 가져오게 고정
  return Array.from(document.querySelectorAll(".color-swatches .swatch:not(.fixed)"));
}

function clearSwatchSlot(sw){
  sw.dataset.color = "";
  sw.classList.add("empty");
  sw.style.background = "transparent";
  sw.title = "빈 슬롯";

  // 이벤트 제거
  sw.onclick = null;
  sw.oncontextmenu = null;

  // active 표시도 제거(선택사항)
  sw.classList.remove("active");
}

function fillSlot(sw, hex){
  hex = normHex(hex);

  sw.dataset.color = hex;
  sw.classList.remove("empty");
  sw.style.background = hex;
  sw.title = hex;

  // ✅ 클릭할 때는 “현재 sw.dataset.color”를 읽어서 적용 (클로저 꼬임 방지)
  sw.onclick = (e) => {
    // Shift+클릭 = 삭제
    if (e.shiftKey) {
      clearSwatchSlot(sw);
      return;
    }

    const cur = normHex(sw.dataset.color);
    if (!cur) return;

    if (typeof applyPlateColor === "function") {
      applyPlateColor(cur);
    }
  };

  // ✅ 우클릭 = 삭제
  sw.oncontextmenu = (e) => {
    e.preventDefault();
    clearSwatchSlot(sw);
  };
}

// ✅ “앞(첫 빈칸)”부터 채우기 + 중복이면 활성화만
window.addOrActivateSwatch = function(hex){
  hex = normHex(hex);
  if (!hex) return;

  const s = slots();
  if (!s.length) return;

  // 1) 이미 있으면 active만
  const existing = s.find(sw => normHex(sw.dataset.color) === hex);
  if (existing) {
    try { syncPlateSwatchesFromColor(hex); } catch(e){}
    return;
  }

  // 2) 첫 빈칸(위/왼쪽부터) 채우기
  const empty = s.find(sw => sw.classList.contains("empty") || !normHex(sw.dataset.color));
  if (empty) {
    fillSlot(empty, hex);
    try { syncPlateSwatchesFromColor(hex); } catch(e){}
    return;
  }

  // 3) 빈칸 없으면 “마지막 칸” 덮어쓰기
  fillSlot(s[s.length - 1], hex);
  try { syncPlateSwatchesFromColor(hex); } catch(e){}
};

/* =================================================================
   2026-01-11: BOM 내보내기 시 파일명 변경 기능 추가
   2026-02-18: 5-Way, 6-Way Tee 리스트 분리 (일반 Tee와 섞이지 않도록 수정)
   ================================================================= */

window.exportBOM = function() {
  // --- 보조 함수 1: 글자 길이 맞춤 ---
  const padString = (str, len) => {
    str = String(str);
    let l = 0;
    for(let i=0; i<str.length; i++) l += (str.charCodeAt(i)>128)?2:1;
    let res = str;
    while(l<len) { res+=" "; l++; }
    return res;
  };

  // --- 보조 함수 2: 표 그리기 ---
  const drawTable = (title, list) => {
    if (list.length === 0) return "";
    let out = `\n[ ${title} ]\n`;
    out += "+---------------------------+---------------+----------+------+\n";
    out += "| 부속 이름 (Part Name)     | 규격          | 길이     | 수량 |\n";
    out += "+---------------------------+---------------+----------+------+\n";
    list.sort((a,b) => a.name.localeCompare(b.name));
    list.forEach(item => {
      let dName = padString(item.name, 25);
      let dSize = padString(item.size, 13);
      let dLen  = padString(item.length, 8);
      let dQty  = item.count.toString().padEnd(4, ' ');
      out += `| ${dName} | ${dSize} | ${dLen} | ${dQty} |\n`;
    });
    out += "+---------------------------+---------------+----------+------+\n";
    return out;
  };

  // --- 보조 함수 3: 진짜 부품만 수집 ---
  const collectRealParts = (object, targetSet) => {
    const d = object.userData || {};
    const isComponent = d.isFitting || d.isPipe || d.isRectPlate || d.isPlate || d.stlName;
    if (d.isSelectionOutline || d.isDimension) return;

    if (isComponent) {
      const parent = object.parent;
      const parentIsComponent = parent && parent.userData && 
                               (parent.userData.isFitting || parent.userData.isPipe || parent.userData.isPlate);
      if (parentIsComponent) return; 
      targetSet.add(object);
      return; 
    }
    if (object.children && object.children.length > 0) {
      object.children.forEach(child => collectRealParts(child, targetSet));
    }
  };

  try {
    // 1. 선택 대상 수집
    const selectedItems = (selectedSet && selectedSet.size > 0) 
                          ? Array.from(selectedSet) 
                          : (selectedMesh ? [selectedMesh] : []);

    if (selectedItems.length === 0) {
      alert("선택된 자재가 없습니다.");
      return;
    }

    const finalTargets = new Set();
    selectedItems.forEach(item => collectRealParts(item, finalTargets));

    if (finalTargets.size === 0) {
      alert("유효한 자재를 찾지 못했습니다.");
      return;
    }

    // 2. 데이터 분석
    const bomMap = new Map();
    const THREAD_OFFSET = 20;
    const PLATE_UNIT_MULTIPLIER = 100;

    finalTargets.forEach((mesh) => {
      try {
        const data = mesh.userData || {};
        let category = "FITTING", finalName = "Unknown Part", size = "-", length = "-";

        const kind = (data.kind || "").toLowerCase();
        const subKind = (data.subKind || "").toLowerCase();
        const stlName = (data.stlName || "").toUpperCase();

        if (data.isPipe === true) {
          category = "PIPE";
          finalName = "Pipe";
          size = data.subKind || data.size || data.spec || "-";
          let rawLength = Math.round(Number(data.lengthMm || data.length || 0));
          let isSTS = String(size).toUpperCase().includes("MM");
          length = (rawLength + (isSTS ? 0 : THREAD_OFFSET)) + "mm";
        } 
        else if (data.isRectPlate || data.isPlate) {
          category = "PLATE";
          if (!mesh.geometry.boundingBox) mesh.geometry.computeBoundingBox();
          const box = mesh.geometry.boundingBox;
          const dim = [
            Math.abs((box.max.x - box.min.x) * mesh.scale.x),
            Math.abs((box.max.y - box.min.y) * mesh.scale.y),
            Math.abs((box.max.z - box.min.z) * mesh.scale.z)
          ].map(v => Math.round(v * PLATE_UNIT_MULTIPLIER)).sort((a,b)=>b-a);
          
          finalName = (data.plateShape === "circle") ? "Circular Plate" : "Rectangular Plate";
          size = (data.plateShape === "circle") ? `${dim[0]},${dim[2]}` : `${dim[0]},${dim[1]},${dim[2]}`;
        }
        else if (data.isFitting === true || data.stlName) {
          category = "FITTING";
          
          // [수정 구간 시작] 부속 이름 판별 로직 강화
          if (kind.includes("cross")) finalName = "Cross Tee";
          else if (kind.includes("5way")) finalName = "5-Way Tee"; // ✅ 5-Way 우선 확인
          else if (kind.includes("6way")) finalName = "6-Way Tee"; // ✅ 6-Way 우선 확인
          else if (kind.includes("elbow")) {
             if (kind.includes("45") || subKind.includes("45")) finalName = "Elbow 45°";
             else if (subKind.includes("s_o") || stlName.includes("SOELBOW")) finalName = "S.O. Elbow";
             else finalName = "Elbow 90°";
          } else if (kind.includes("tee")) {
             if (subKind.includes("s_o") || stlName.includes("SOTEE")) finalName = "S.O. Tee";
             else finalName = "Tee";
          } else if (kind.includes("cap")) finalName = "Cap";
          else if (kind.includes("reduce")) finalName = "Reducer";
          else if (kind.includes("socket")) finalName = "Socket";
          else if (kind.includes("flange")) finalName = "Flange";
          else if (kind.includes("union")) finalName = "Union";
          else if (kind.includes("bush")) finalName = "Bushing";
          else if (kind.includes("plug")) finalName = "Plug";
          else finalName = data.stlName || data.name || "Fitting";
          // [수정 구간 끝]

          let rawSize = data.size || data.spec || data.subKind || "-";
          if (String(rawSize).toLowerCase().includes("s_o") || rawSize === "so") {
             const match = stlName.match(/([0-9]+)A/);
             if (match) rawSize = match[0];
             else {
               if (stlName.includes("15")) rawSize = "15A";
               else if (stlName.includes("20")) rawSize = "20A";
               else if (stlName.includes("25")) rawSize = "25A";
               else rawSize = "15A";
             }
          }
          size = String(rawSize).toUpperCase();
        }

        const key = `${category}|${finalName}|${size}|${length}`;
        if (bomMap.has(key)) bomMap.get(key).count++;
        else bomMap.set(key, { category, name: finalName, size, length, count: 1 });
      } catch (e) {}
    });

    // 4. 출력 및 저장
    let textOutput = "========================================================\n";
    textOutput += "              [ 자재 리스트 (정밀 산출) ]              \n";
    textOutput += "========================================================\n";
    textOutput += `작성일: ${new Date().toLocaleString()}\n`;

    const items = [...bomMap.values()];
    textOutput += drawTable("1. 배관 부속 (Fittings)", items.filter(i => i.category === "FITTING"));
    textOutput += drawTable("2. 파이프 (Pipes)", items.filter(i => i.category === "PIPE"));
    textOutput += drawTable("3. 판재 (Plates)", items.filter(i => i.category === "PLATE"));

    // 파일명 입력 받기
    let fileName = prompt("저장할 리스트 파일 이름을 입력하세요:", "ETE_BOM_List");
    if (fileName === null) return; // 취소 시 중단

    if (!fileName.toLowerCase().endsWith(".txt")) {
        fileName += ".txt";
    }

    const blob = new Blob([textOutput], { type: "text/plain;charset=utf-8" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = fileName;
    link.click();

  } catch (err) {
    alert("BOM 추출 중 오류 발생: " + err.message);
  }
};

   2026-01-11: 부속 생성 위치 로직 개선 (스마트 배치)
      - 선택된 객체가 있으면 -> 그 객체의 X,Z 중심 위치에 생성
      - 선택된 객체가 없으면 -> 화면 중앙(Looking At)에 생성
   ================================================================= */

function placeAtCenterAndGround(obj) {
  // 1. 현재 선택된 개체들이 있는지 확인
  const targets = (selectedSet && selectedSet.size > 0) 
                  ? Array.from(selectedSet) 
                  : (selectedMesh ? [selectedMesh] : []);

  if (targets.length > 0) {
    // 🎯 [CASE A] 선택된 개체가 있음 -> 그 위치(X, Z)로 이동
    // 여러 개를 선택했더라도 전체를 감싸는 중심점을 계산합니다.
    const box = new THREE.Box3();
    targets.forEach(t => {
        if (!t) return;
        // 정확한 월드 박스 계산
        const b = new THREE.Box3().setFromObject(t);
        box.union(b);
    });
    
    const center = new THREE.Vector3();
    box.getCenter(center);
    
    // 선택된 개체의 중심 좌표(X, Z)로 이동 (Y는 바닥에 붙이기 위해 0으로)
    obj.position.set(center.x, 0, center.z);
    
  } else {
    // 🌐 [CASE B] 선택된 개체 없음 -> 기존처럼 화면 중앙 바닥(Raycasting)
    const ray = new THREE.Raycaster();
    ray.setFromCamera(new THREE.Vector2(0, 0), camera);
    
    const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const target = new THREE.Vector3();

    // 바닥과 교차점 계산
    if (ray.ray.intersectPlane(groundPlane, target)) {
      obj.position.set(target.x, target.y, target.z);
    } else {
      // 하늘을 보고 있다면 카메라 앞 30 거리
      const dist = 30; 
      ray.ray.at(dist, target);
      obj.position.set(target.x, target.y, target.z);
    }
  }

  // 공통 마무리: 높이(Y)를 계산해 바닥에 딱 붙임
  placeOnGround(obj);
}



/* =================================================================
   2026-01-11: 정렬 기능 고도화 (중심 정렬 -> 끝단 정렬 지원)
      - alignSelectionToBounds() 함수 추가
      - Top 정렬 시 100mm(중심)가 아닌 200mm(상단)에 맞추도록 개선
   ================================================================= */

// ✅ [신규] 외곽선(Bounding Box) 기준 정렬 함수
// axis: 'x'|'y'|'z', side: 'min'(최소) | 'max'(최대) | 'center'(중심)
function alignSelectionToBounds(axis, side) {
  // 1. 선택 개체 확인
  const targets = (selectedSet && selectedSet.size > 0) 
                  ? Array.from(selectedSet) 
                  : (selectedMesh ? [selectedMesh] : []);

  if (targets.length < 2) {
    alert("기준(첫번째) + 이동할 개체(두번째 이상)를 선택하세요.");
    return;
  }

  saveState();

  // 2. 기준(Anchor) = 첫 번째 선택한 객체
  const anchor = targets[0];
  
  // 기준의 BoundingBox 계산
  // (점선 윤곽선 제외하고 본체 크기만 계산하는 유틸 사용)
  const anchorBox = getWorldBoxIgnoreOutline(anchor) || new THREE.Box3().setFromObject(anchor);
  
  // 기준값 찾기 (예: Top 정렬이면 max.y)
  let targetVal = 0;
  if (side === 'max') targetVal = anchorBox.max[axis];
  else if (side === 'min') targetVal = anchorBox.min[axis];
  else {
    // center
    targetVal = (anchorBox.max[axis] + anchorBox.min[axis]) / 2;
  }

  // 3. 나머지 객체들을 이동
  for (let i = 1; i < targets.length; i++) {
    const mover = targets[i];
    const moverBox = getWorldBoxIgnoreOutline(mover) || new THREE.Box3().setFromObject(mover);

    let currentVal = 0;
    if (side === 'max') currentVal = moverBox.max[axis];
    else if (side === 'min') currentVal = moverBox.min[axis];
    else currentVal = (moverBox.max[axis] + moverBox.min[axis]) / 2;

    const diff = targetVal - currentVal;

    // 해당 축으로 이동
    mover.position[axis] += diff;

    // 포트/치수 등 업데이트
    if (typeof updatePortVisuals === "function") updatePortVisuals(mover);
  }

  updateRotationGizmo();
  if (dimensionEnabled && typeof showDimensionsSmartForSelection === "function") {
    showDimensionsSmartForSelection();
  }
}
